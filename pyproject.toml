[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-context-lab"
version = "0.1.0"
description = "Reproducible evolving-context experiments under policy drift"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ace-context-lab = "ace_lab.run:main"

[tool.setuptools.packages.find]
include = ["ace_lab*"]
